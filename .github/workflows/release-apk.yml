name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  publish-release-apk:
    name: Publish test APK prerelease
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Resolve release version
        id: version
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/build.gradle)"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::android/build.gradle contains an invalid versionName: $version_name"
            exit 1
          fi
          release_tag="v$version_name-test.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          if git show-ref --tags --verify --quiet "refs/tags/$release_tag"; then
            echo "::error::Tag $release_tag already exists. Start a new workflow run."
            exit 1
          fi
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Test and build debug-signed APK
        run: gradle :android:testDebugUnitTest :android:assembleDebug --stacktrace
      - name: Prepare test asset
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/debug/android-debug.apk "dist/parallel-verse-${{ steps.version.outputs.version }}-test-arm64-v8a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-verse-${{ steps.version.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create tag and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Parallel Verse test ${{ steps.version.outputs.tag }}" \
            --prerelease \
            --notes "Testing-only debug build. It is not production signed; installing a later CI build may require uninstalling this one first."
